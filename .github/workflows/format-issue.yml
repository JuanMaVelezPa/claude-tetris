name: Format Issue with Cursor

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  format-issue:
    # Avoid loops: editing the body does not change the author; filter by who triggered the event
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Cursor Agent
        uses: PunGrumpy/cursor-action@v1
        id: cursor
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          prompt: |
            You are a project management assistant.
            The issue below is written in Spanish. Translate it to English and rewrite it as clear Markdown so both humans and AI coding agents can understand the request without ambiguity.
            Also choose GitHub labels that fit the problem.

            Current title: ${{ github.event.issue.title }}
            Current body:
            ${{ github.event.issue.body }}

            Allowed labels (use only names from this list):
            - bug
            - enhancement
            - documentation
            - question
            - accessibility
            - good first issue
            - help wanted
            - duplicate
            - invalid
            - wontfix

            Instructions:
            1. Translate all content from Spanish to English.
            2. Fix spelling and wording in the English result.
            3. Write the entire description in GitHub-flavored Markdown (headings, lists, code fences when useful).
            4. Use these Markdown sections when they apply:
               - ## Description
               - ## Steps to Reproduce
               - ## Expected Behavior
               - ## Additional Context (optional)
            5. Prefer concrete, actionable wording (what to change, where, and acceptance criteria) so an AI can implement or triage the issue.
            6. Pick 1-3 labels from the allowed list that best match the issue. Prefer bug, enhancement, documentation, question, or accessibility. Use duplicate/invalid/wontfix only when clearly appropriate.
            7. Return ONLY a single JSON object (no markdown fence, no commentary) with this shape:
               {"body":"<formatted English Markdown body>","labels":["bug"]}

      - name: Update Issue on GitHub
        if: ${{ steps.cursor.outputs.summary != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const raw = process.env.CURSOR_OUTPUT;
            if (!raw || !raw.trim()) {
              core.info('Empty Cursor output; skipping update');
              return;
            }

            const allowed = new Set([
              'bug',
              'enhancement',
              'documentation',
              'question',
              'accessibility',
              'good first issue',
              'help wanted',
              'duplicate',
              'invalid',
              'wontfix'
            ]);

            function extractJson(text) {
              const trimmed = text.trim();
              try {
                return JSON.parse(trimmed);
              } catch (_) {
                // Agent sometimes wraps JSON in a fence or adds prose
                const fenced = trimmed.match(/```(?:json)?\s*([\s\S]*?)```/i);
                if (fenced) {
                  return JSON.parse(fenced[1].trim());
                }
                const start = trimmed.indexOf('{');
                const end = trimmed.lastIndexOf('}');
                if (start !== -1 && end > start) {
                  return JSON.parse(trimmed.slice(start, end + 1));
                }
                throw new Error('Could not parse Cursor output as JSON');
              }
            }

            let body = raw.trim();
            let labels = [];

            try {
              const parsed = extractJson(raw);
              if (parsed && typeof parsed.body === 'string' && parsed.body.trim()) {
                body = parsed.body.trim();
              }
              if (parsed && Array.isArray(parsed.labels)) {
                labels = [...new Set(
                  parsed.labels
                    .filter((l) => typeof l === 'string')
                    .map((l) => l.trim().toLowerCase())
                    .filter((l) => allowed.has(l))
                )];
              }
            } catch (err) {
              core.warning(`JSON parse failed (${err.message}); updating body only`);
            }

            const update = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            };
            if (labels.length) {
              update.labels = labels;
            }

            await github.rest.issues.update(update);
            core.info(
              labels.length
                ? `Updated issue body and labels: ${labels.join(', ')}`
                : 'Updated issue body (no labels applied)'
            );
        env:
          CURSOR_OUTPUT: ${{ steps.cursor.outputs.summary }}
