name: Format Issue with Cursor

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  format-issue:
    # Avoid loops: editing the body does not change the author; filter by who triggered the event
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Cursor Agent
        uses: PunGrumpy/cursor-action@v1
        id: cursor
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          prompt: |
            You are a project management assistant.
            The issue below is written in Spanish. Translate it to English and rewrite it in a professional format.

            Current title: ${{ github.event.issue.title }}
            Current body:
            ${{ github.event.issue.body }}

            Instructions:
            1. Translate all content from Spanish to English.
            2. Fix spelling and wording in the English result.
            3. Add Markdown sections: **Description**, **Steps to Reproduce** (if applicable), and **Expected Behavior**.
            4. Return ONLY the final formatted English text.

      - name: Update Issue on GitHub
        if: ${{ steps.cursor.outputs.summary != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const formattedBody = process.env.CURSOR_OUTPUT;
            if (!formattedBody || !formattedBody.trim()) {
              core.info('Empty Cursor output; skipping update');
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: formattedBody
            });
        env:
          CURSOR_OUTPUT: ${{ steps.cursor.outputs.summary }}
