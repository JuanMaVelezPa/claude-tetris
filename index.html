<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 class="game-title">TETRIS</h1>
      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Cambiar a modo claro"
        aria-pressed="false"
        title="Cambiar tema"
      >
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb">
            <svg class="theme-toggle-glyph theme-toggle-glyph--moon" viewBox="0 0 24 24" width="14" height="14">
              <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5z"/>
            </svg>
            <svg class="theme-toggle-glyph theme-toggle-glyph--sun" viewBox="0 0 24 24" width="14" height="14">
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="22" y2="12"/>
                <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/>
                <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
                <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>
                <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/>
              </g>
            </svg>
          </span>
        </span>
      </button>
    </header>
    <div class="wrapper">
      <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>

        <aside class="panel">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> pausa</li>
            </ul>
          </div>
        </aside>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      Desarrollado por
      <a href="https://github.com/JuanMaVelezPa" target="_blank" rel="noopener noreferrer">JuanMaVelezPa</a>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
